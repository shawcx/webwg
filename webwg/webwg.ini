[webwg]
addr     = 127.0.0.1
port     = 9999
sessions = dbcache

[records]
data

[data]
module   = webwg.data
database = sqlite

[sessions]
expires  = 1
interval = 60

[databases]
sqlite

[sqlite]
database = webwg.db

[caches]
dbcache

[dbcache]
database = sqlite
username
auth
agent
ip
time = int

[logins]
dblogin
gitlab

[dblogin]
database = sqlite
table    = users
disabled = bool
isadmin  = bool
created  = int
last     = int

[gitlab]
gitlab        = https://localhost
client_id     = <client-id>
client_secret = <client-secret>

[supports]
nginx
systemd
