
map $cookie_mpt $mpt_hascookie {
	"replace-with-a-random-cookie-value" "y";
	default                            "n";
}

geo $mpt_geo {
	10.8.0.0/24                        "y";
	default                            "n";
}

map $mpt_hascookie$mpt_geo $mpt_auth {
	"yy"     "off";
	"yn"     "off";
	"ny"     "off";
	default  "Tickets Please";
}

server {
        listen      80 default_server;
        listen [::]:80 default_server;

        root /var/www/html;

        index index.html;

        server_name _;

	location /auth {
		proxy_pass_header Server;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Scheme $scheme;
		proxy_pass http://127.0.0.1:4888;
		proxy_redirect off;
	}

	location ~* ^/$ {
 		if ($http_cookie ~* "replace-with-a-random-cookie-value") {
    			return 302 $scheme://$hostname/auth;
		}
	}

        location / {
		auth_basic  $mpt_auth;
		add_header Set-Cookie "mpt=replace-with-a-random-cookie-value;max-age=7200;path=/"; #set that special cookie, when everything is ok
                try_files $uri $uri/ =404;
        }
}
